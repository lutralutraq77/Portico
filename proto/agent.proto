syntax = "proto3";

package portico.agent.v1;
option go_package = "portico.local/portico/internal/agentpb";

// OS peer credentials authenticate the local caller. Inventory is advisory;
// neither this response nor a local socket connection grants resource access.
message CatalogRequest {
  uint32 version = 1;
}

message Resource {
  string id = 1;
  int64 revision = 2;
  string name = 3;
  string connector_id = 4;
  string connector_name = 5;
  string address = 6;
  string protocol = 7;
  uint32 port = 8;
  string until = 9;
}

message CatalogResponse {
  uint32 version = 1;
  repeated Resource resources = 2;
}

// OPEN selects only a resource ID and exact revision. READY follows the
// existing remote authorization/open handshake. Client CloseSend is input FIN;
// server FIN closes output only. Final RPC status still carries late failures.
message TunnelFrame {
  enum Kind {
    UNSPECIFIED = 0;
    OPEN = 1;
    READY = 2;
    DATA = 3;
    FIN = 4;
  }
  uint32 version = 1;
  Kind kind = 2;
  string resource_id = 3;
  int64 revision = 4;
  bytes data = 5;
}

message StateRequest { uint32 version = 1; }
message UnlockRequest {
  uint32 version = 1;
  bytes passphrase = 2;
}
message StateResponse {
  enum State {
    UNSPECIFIED = 0;
    LOCKED = 1;
    UNLOCKING = 2;
    UNLOCKED = 3;
    DRAINING = 4;
  }
  uint32 version = 1;
  State state = 2;
}

service Agent {
  rpc Catalog(CatalogRequest) returns (CatalogResponse);
  rpc Connect(stream TunnelFrame) returns (stream TunnelFrame);
  rpc Status(StateRequest) returns (StateResponse);
  rpc Unlock(UnlockRequest) returns (StateResponse);
  rpc Lock(StateRequest) returns (StateResponse);
}

name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4 resolved 2026-09-07
        with:
          languages: go
          build-mode: manual
      - name: Build all application packages
        run: |
          go telemetry off
          go build -trimpath ./...
          cd issuer
          go build -trimpath ./...
        env:
          GOTOOLCHAIN: local
          GOTELEMETRY: 'off'
          GOFLAGS: -mod=readonly
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # same reviewed source snapshot
